<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="60%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b3d91" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#030712"/>
  <!-- Anel orbital -->
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" transform="rotate(-25 32 32)"/>
  <!-- Sol / Planeta central -->
  <circle cx="32" cy="32" r="13" fill="url(#sunGrad)"/>
  <!-- Lua / Satélite -->
  <circle cx="49" cy="24" r="3.5" fill="#00f0ff"/>
</svg>
